<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>426 PREMIUM – Cinema Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0f1014;       /* ดำลึกสไตล์ Cinema */
      --card-dark: #1a1c23;     /* เทาเข้มพรีเมียม */
      --accent-red: #e50914;    /* แดง Netflix Style */
      --accent-gold: #ffc107;   /* ทอง VIP */
      --text-white: #ffffff;
      --text-gray: #a0a0a0;
      --glass: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      font-family: 'Anuphan', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-white);
      /* พื้นหลังไล่เฉดสีแบบสปอตไลท์หนัง */
      background-image: radial-gradient(circle at 50% -20%, #2c1618 0%, #0f1014 60%);
      min-height: 100vh; display: flex; justify-content: center;
    }

    .app-container {
      width: 100%; max-width: 480px;
      padding: 30px 20px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* Header: สไตล์แอป Streaming */
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--glass);
    }
    .brand-logo {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -1px;
      background: linear-gradient(90deg, var(--accent-red), #ff4d4d);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .vip-badge {
      background: var(--accent-gold); color: #000;
      font-size: 0.65rem; font-weight: 800; padding: 4px 10px;
      border-radius: 6px; text-transform: uppercase;
    }

    /* Hero Section: ความสะดวกสำหรับลูกค้า */
    .hero-card {
      background: linear-gradient(135deg, #1e1e26 0%, #111115 100%);
      border-radius: 24px; padding: 25px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .hero-card h2 { font-size: 1.2rem; margin: 0 0 15px; font-weight: 700; }

    /* Input Modern Style */
    .input-box {
      background: rgba(0,0,0,0.3); border-radius: 16px;
      padding: 15px; border: 1px solid #333; transition: 0.3s;
    }
    .input-box:focus-within { border-color: var(--accent-red); box-shadow: 0 0 15px rgba(229, 9, 20, 0.2); }
    textarea {
      width: 100%; height: 80px; border: none; background: transparent;
      color: white; font-family: inherit; font-size: 1rem; resize: none; outline: none;
    }

    .btn-play {
      width: 100%; padding: 18px; margin-top: 15px; border-radius: 16px;
      border: none; background: var(--accent-red); color: white;
      font-size: 1.1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: 0.3s;
    }
    .btn-play:hover { background: #ff1f2d; transform: scale(1.02); }
    .btn-play:active { transform: scale(0.98); }

    /* Warning Overlay */
    .alert-banner {
      background: rgba(229, 9, 20, 0.1); border-left: 4px solid var(--accent-red);
      padding: 12px 15px; border-radius: 12px; font-size: 0.75rem; color: #ff8080;
      font-weight: 600; display: flex; align-items: center; gap: 8px;
    }

    /* Result Section: สไตล์รายการหนัง */
    .result-item {
      background: var(--card-dark); border-radius: 20px;
      overflow: hidden; margin-top: 15px;
      border: 1px solid rgba(255,255,255,0.05);
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } }

    .item-header {
      background: rgba(255,255,255,0.03); padding: 10px 20px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.7rem; color: var(--text-gray); font-weight: 700;
    }
    .item-body { padding: 20px; font-size: 0.95rem; line-height: 1.6; font-weight: 500; }

    /* ปุ่มลอยด้านล่างสำหรับความสะดวก */
    .quick-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;
    }
    .btn-secondary {
      background: #2a2d36; color: white; border: none; padding: 12px;
      border-radius: 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    }

    footer { text-align: center; margin-top: 40px; padding-bottom: 30px; }
    .support-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #06c755; color: white; padding: 10px 25px;
      border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="brand-logo">426 CINEMA</div>
      <div class="vip-badge">Premium Client</div>
    </header>

    <div class="alert-banner">
      <span>⚠️ Warning: ห้ามรีเฟรชหน้าจอนะคะ ข้อมูลจะหายทันที!</span>
    </div>

    <main class="hero-card">
      <h2>Redeem Now</h2>
      <div class="input-box">
        <textarea id="codeInput" placeholder="วางรหัสพรีเมียมที่ได้รับ..."></textarea>
      </div>
      <button class="btn-play" id="btnRedeem">
        <span>GET ACCESS</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="quick-actions">
        <button class="btn-secondary" onclick="document.getElementById('codeInput').value='';">ล้างช่องกรอก</button>
        <button class="btn-secondary" onclick="location.href='https://line.me/ti/p/@467dlpti'">แจ้งปัญหา</button>
      </div>
    </main>

    <div id="results"></div>

    <footer>
      <a href="https://line.me/ti/p/@467dlpti" class="support-btn">
        <span>Contact Concierge Line</span>
      </a>
      <p style="font-size: 0.6rem; color: #555; margin-top: 15px; letter-spacing: 2px;">426 ENTERTAINMENT SYSTEM v2.0</p>
    </footer>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5mil7Axii3dSqUOAnU_Xd--hIp9ErKbfuw41vuPlOvPpt9tdZT2I6ZjmiU0No192j/exec";
    const btn = document.getElementById("btnRedeem");
    const input = document.getElementById("codeInput");
    const resultsArea = document.getElementById("results");

    window.onbeforeunload = function() {
      if (resultsArea.children.length > 0) return "ข้อมูลการเข้าถึงจะหายไปหากคุณออกตอนนี้!";
    };

    btn.addEventListener("click", async () => {
      const val = input.value.trim();
      if (!val) return;

      btn.disabled = true;
      btn.innerHTML = "LOADING CONTENT... ⏳";
      resultsArea.innerHTML = "";

      try {
        const res = await fetch(`${API_URL}?action=redeem&text=${encodeURIComponent(val)}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const card = document.createElement("div");
            card.className = "result-item";
            card.innerHTML = `
              <div class="item-header">
                <span>TITLE: ${item.appName || 'PREMIUM ACCESS'}</span>
                <span style="color:var(--accent-gold);">★ ACTIVE</span>
              </div>
              <div class="item-body">${item.reply}</div>
              <div style="padding:0 20px 20px;">
                <button class="btn-play" style="padding:12px; font-size:0.85rem;" onclick="copyAccess('${item.reply.replace(/\n/g, "\\n")}', this)">
                  COPY DETAILS
                </button>
              </div>
            `;
            resultsArea.appendChild(card);
          });
          window.scrollTo({ top: resultsArea.offsetTop, behavior: 'smooth' });
        } else {
          resultsArea.innerHTML = `<div style="text-align:center; padding:30px; font-size:0.8rem; color:#ff4d4d; font-weight:700;">ACCESS DENIED: ไม่พบรหัส หรือรหัสถูกใช้แล้วค่ะ</div>`;
        }
      } catch (e) {
        resultsArea.innerHTML = `<div style="text-align:center; padding:30px; font-size:0.8rem; color:#ff4d4d;">SERVER ERROR: โปรดตรวจสอบการเชื่อมต่อ</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>GET ACCESS</span><svg width='20' height='20' viewBox='0 0 24 24' fill='currentColor'><path d='M8 5v14l11-7z'/></svg>";
      }
    });

    function copyAccess(text, btnEl) {
      navigator.clipboard.writeText(text.replace(/\\n/g, "\n")).then(() => {
        const original = btnEl.innerHTML;
        btnEl.innerHTML = "COPIED TO CLIPBOARD ✅";
        btnEl.style.background = "#28a745";
        setTimeout(() => {
          btnEl.innerHTML = original;
          btnEl.style.background = "";
        }, 2000);
      });
    }
  </script>
</body>
</html>
