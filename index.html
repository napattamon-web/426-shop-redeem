<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>426 CUTE CINEMA – Premium Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cinema-pink: #ff85a1;
      --cinema-purple: #9b5de5;
      --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #f3e8ff 100%);
      --glass-white: rgba(255, 255, 255, 0.7);
      --text-dark: #4a3f35;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      font-family: 'Anuphan', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-dark);
      min-height: 100vh; display: flex; justify-content: center;
    }

    .app-wrapper {
      width: 100%; max-width: 440px;
      padding: 30px 15px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* Modern App Header */
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 5px;
    }
    .brand-title {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -1px;
      background: linear-gradient(to right, var(--cinema-pink), var(--cinema-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .status-badge {
      background: #fff; padding: 5px 12px; border-radius: 99px;
      font-size: 0.7rem; font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      color: var(--cinema-pink); display: flex; align-items: center; gap: 5px;
    }
    .online-dot { width: 6px; height: 6px; background: #90beaa; border-radius: 50%; }

    /* Main Containerสไตล์แอปสมัยใหม่ */
    .glass-card {
      background: var(--glass-white);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: 35px; padding: 25px;
      border: 2px solid #ffffff;
      box-shadow: 0 20px 40px rgba(255, 133, 161, 0.1);
    }

    /* Warning Banner */
    .cute-alert {
      background: #fff; border-radius: 20px; padding: 12px 15px;
      margin-bottom: 20px; border: 1.5px dashed var(--cinema-pink);
      font-size: 0.75rem; color: #ff5c8a; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }

    /* Input Styling */
    .input-section { margin-bottom: 15px; }
    .input-label { font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; display: block; padding-left: 5px; }
    
    .input-box {
      background: rgba(255, 255, 255, 0.5); border-radius: 22px;
      padding: 18px; border: 2px solid transparent; transition: 0.3s;
    }
    .input-box:focus-within { border-color: var(--cinema-pink); background: #fff; transform: translateY(-2px); }
    textarea {
      width: 100%; height: 90px; border: none; background: transparent;
      font-family: inherit; font-size: 1rem; color: var(--text-dark); resize: none; outline: none;
    }

    /* Quick Action Buttons (อำนวยความสะดวก) */
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .btn-small {
      background: #fff; border: none; padding: 12px; border-radius: 15px;
      font-size: 0.75rem; font-weight: 700; color: #a0a0a0; cursor: pointer; transition: 0.2s;
    }
    .btn-small:active { background: #fdf0f3; color: var(--cinema-pink); }

    /* Main Submit Button (สไตล์ป้ายหน้าร้าน) */
    .btn-get {
      width: 100%; padding: 18px; margin-top: 20px; border-radius: 22px;
      border: none; background: linear-gradient(135deg, var(--cinema-pink), var(--cinema-purple));
      color: white; font-size: 1.1rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 10px 25px rgba(155, 93, 229, 0.3); transition: 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-get:active { transform: scale(0.96); opacity: 0.9; }

    /* Result Cards */
    .result-card {
      background: #fff; border-radius: 25px; padding: 20px;
      margin-top: 15px; border: 1px solid #f1f3f5;
      animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popUp { from { opacity: 0; transform: scale(0.9); } }

    .tag-movie {
      background: #f3e8ff; color: var(--cinema-purple);
      padding: 4px 12px; border-radius: 10px; font-size: 0.7rem; font-weight: 800;
    }

    .btn-copy-cinema {
      width: 100%; padding: 12px; margin-top: 15px; border-radius: 18px;
      border: none; background: #f8f9fa; color: var(--text-dark);
      font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s;
    }
    .btn-copy-cinema:hover { background: #fff0f3; color: var(--cinema-pink); }

    footer { text-align: center; margin-top: auto; padding: 30px 0; }
    .line-support {
      display: inline-flex; align-items: center; gap: 8px;
      background: #06c755; color: white; padding: 10px 22px;
      border-radius: 99px; text-decoration: none; font-weight: 700; font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <header class="app-header">
      <div class="brand-title">426 CUTE CINEMA</div>
      <div class="status-badge"><span class="online-dot"></span> Online</div>
    </header>

    <main class="glass-card">
      <div class="cute-alert">
        <span style="font-size: 1.2rem;">🎀</span>
        <span>ห้ามรีเฟรชหน้าจอนะคะ ข้อมูลจะหายทันที!</span>
      </div>

      <div class="input-section">
        <label class="input-label">วางรหัสรับสิทธิ์ 🍿</label>
        <div class="input-box">
          <textarea id="codeInput" placeholder="วางโค้ดที่แอดมินส่งให้..."></textarea>
        </div>
        
        <div class="action-row">
          <button class="btn-small" onclick="document.getElementById('codeInput').value=''">ล้างข้อความ</button>
          <button class="btn-small" onclick="location.reload()">เริ่มใหม่</button>
        </div>
      </div>

      <button class="btn-get" id="btnRedeem">
        <span>GET MOVIE PASS</span>
        <span style="font-size: 1.3rem;">✨</span>
      </button>

      <div id="results"></div>
    </main>

    <footer>
      <a href="https://line.me/ti/p/@467dlpti" class="line-support">
        <span>Line: @467dlpti</span>
      </a>
      <p style="font-size: 0.65rem; color: #bca08e; margin-top: 15px; font-weight: 700;">PREMIUM CINEMA EXPERIENCE</p>
    </footer>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5mil7Axii3dSqUOAnU_Xd--hIp9ErKbfuw41vuPlOvPpt9tdZT2I6ZjmiU0No192j/exec";
    const btn = document.getElementById("btnRedeem");
    const input = document.getElementById("codeInput");
    const resultsArea = document.getElementById("results");

    window.onbeforeunload = function() {
      if (resultsArea.children.length > 0) return "ข้อมูลรหัสหนังจะหายไปนะคะ!";
    };

    btn.addEventListener("click", async () => {
      const code = input.value.trim();
      if (!code) return;

      btn.disabled = true;
      btn.innerHTML = "กำลังเตรียมที่นั่ง... 🎞️";
      resultsArea.innerHTML = "";

      try {
        const res = await fetch(`${API_URL}?action=redeem&text=${encodeURIComponent(code)}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const card = document.createElement("div");
            card.className = "result-card";
            card.innerHTML = `
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span class="tag-movie">${item.appName || 'PREMIUM'}</span>
                <span style="font-size:0.6rem; color:#ccc;">ID: ${item.code.substring(0,5)}</span>
              </div>
              <div style="font-weight:600; line-height:1.6; font-size:0.95rem; white-space:pre-wrap;">${item.reply}</div>
              <button class="btn-copy-cinema">คัดลอกรายละเอียด 📋</button>
            `;
            card.querySelector("button").onclick = (e) => copyText(item.reply, e.target);
            resultsArea.appendChild(card);
          });
        } else {
          resultsArea.innerHTML = `<div style="text-align:center; padding:20px; font-size:0.8rem; color:#ff85a1; font-weight:700;">ไม่พบโค้ดหนังนี้ในระบบค่ะ 🥺</div>`;
        }
      } catch (e) {
        resultsArea.innerHTML = `<div style="text-align:center; padding:20px; font-size:0.8rem; color:#ff85a1;">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>GET MOVIE PASS</span><span style='font-size: 1.3rem;'>✨</span>";
      }
    });

    function copyText(text, el) {
      navigator.clipboard.writeText(text).then(() => {
        const original = el.innerHTML;
        el.innerHTML = "คัดลอกแล้วค่า! ✅";
        el.style.color = "#90beaa";
        setTimeout(() => {
          el.innerHTML = original;
          el.style.color = "";
        }, 2000);
      });
    }
  </script>
</body>
</html>
