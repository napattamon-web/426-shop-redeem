<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>426 SHOP – Official System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bear-dark: #6d4c41;   /* น้ำตาลเข้มตัวหมี */
      --bear-milk: #bca08e;   /* น้ำตาลนม */
      --bear-cream: #f5ebe0;  /* ครีมพาสเทล */
      --bear-white: #ffffff;
      --warn-red: #d68a8a;    /* แดงพาสเทล */
      --soft-shadow: 0 10px 25px rgba(109, 76, 65, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      font-family: 'Anuphan', sans-serif;
      background-color: #faf7f2;
      color: var(--bear-dark);
      display: flex; justify-content: center; min-height: 100vh;
    }

    .app-container {
      width: 100%; max-width: 420px;
      padding: 40px 20px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* Header & Branding */
    .header { text-align: center; margin-bottom: 10px; }
    .brand-name {
      font-size: 2.2rem; font-weight: 800; letter-spacing: 1px;
      color: var(--bear-dark); margin: 0;
    }
    .status-24h {
      font-size: 0.75rem; font-weight: 700; color: var(--bear-milk);
      margin-top: 8px; letter-spacing: 2px;
    }

    /* Warning Banner กระพริบ */
    .warning-banner {
      background: var(--bear-white);
      border: 2px solid var(--warn-red);
      border-radius: 20px; padding: 15px;
      text-align: center;
      box-shadow: var(--soft-shadow);
      animation: blink-border 1.5s infinite;
    }
    .warning-text {
      color: var(--warn-red); font-weight: 800; font-size: 0.85rem;
      animation: blink-text 1.5s infinite;
    }
    @keyframes blink-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes blink-border { 0%, 100% { border-color: var(--warn-red); } 50% { border-color: transparent; } }

    /* Main Card */
    .bear-card {
      background: var(--bear-white); border-radius: 35px;
      padding: 30px 25px; border: 1px solid var(--bear-cream);
      box-shadow: var(--soft-shadow);
      position: relative;
    }

    /* ตกแต่งรูปทรงหมี (CSS Only No Emoji) */
    .bear-ear-left, .bear-ear-right {
      width: 40px; height: 40px; background: var(--bear-white);
      border-radius: 50%; position: absolute; top: -15px; z-index: -1;
      border: 1px solid var(--bear-cream);
    }
    .bear-ear-left { left: 40px; } .bear-ear-right { right: 40px; }

    .label-title {
      font-size: 0.9rem; font-weight: 700; color: var(--bear-milk);
      margin-bottom: 15px; display: block; text-align: center;
    }

    /* Input Field */
    .input-wrapper {
      background: var(--bear-cream); border-radius: 22px;
      padding: 20px; border: 2px solid transparent;
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .input-wrapper.active-focus {
      background: var(--bear-white); border-color: var(--bear-milk);
      box-shadow: 0 5px 15px rgba(188, 160, 142, 0.2);
    }
    textarea {
      width: 100%; height: 90px; border: none; background: transparent;
      font-family: inherit; font-size: 1.05rem; color: var(--bear-dark);
      resize: none; outline: none; text-align: center;
    }

    /* นุบนิบปุ่มกด */
    .btn-main {
      width: 100%; padding: 20px; margin-top: 20px; border-radius: 25px;
      border: none; background: var(--bear-dark); color: var(--bear-cream);
      font-size: 1.1rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 0 #4e342e;
      transition: 0.2s;
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #4e342e; }
    .btn-main:active { transform: translateY(4px); box-shadow: 0 2px 0 #4e342e; }

    /* Shake Effect สำหรับมือถือ */
    .shake { animation: shake-ani 0.4s ease-in-out; border-color: var(--warn-red) !important; }
    @keyframes shake-ani {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    /* Result Style */
    #resultContainer { margin-top: 20px; }
    .result-box {
      background: var(--bear-white); border-radius: 25px;
      padding: 20px; margin-bottom: 15px; border: 1px solid var(--bear-cream);
      animation: slide-up 0.5s ease;
    }
    @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } }

    .btn-copy-bear {
      width: 100%; padding: 12px; margin-top: 15px; border-radius: 18px;
      border: 1.5px solid var(--bear-cream); background: var(--bear-white);
      color: var(--bear-milk); font-weight: 700; font-size: 0.85rem; cursor: pointer;
    }
    .btn-copy-bear:hover { background: var(--bear-cream); color: var(--bear-dark); }

    /* Footer */
    footer { text-align: center; margin-top: auto; padding-bottom: 30px; }
    .line-contact {
      font-size: 0.85rem; color: var(--bear-milk); text-decoration: none;
      font-weight: 700; border-bottom: 1.5px solid var(--bear-cream);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1 class="brand-name">426 SHOP</h1>
      <div class="status-24h">ONLINE 24 HOURS</div>
    </header>

    <div class="warning-banner">
      <div class="warning-text">ห้ามรีเฟรชหน้าจอเด็ดขาด ข้อมูลจะหายทันที</div>
    </div>

    <main class="bear-card">
      <div class="bear-ear-left"></div>
      <div class="bear-ear-right"></div>
      
      <label class="label-title">ระบุโค้ดเพื่อรับสินค้า</label>
      <div class="input-wrapper" id="inputFrame">
        <textarea id="codeInput" placeholder="กรอกรหัสแจ้งรับสินค้าที่นี่" onfocus="this.parentElement.classList.add('active-focus')" onblur="this.parentElement.classList.remove('active-focus')"></textarea>
      </div>

      <button class="btn-main" id="btnRedeem">รับสินค้าแจ้งโค้ด</button>
    </main>

    <div id="resultContainer"></div>

    <footer>
      <a href="https://line.me/ti/p/@467dlpti" class="line-contact">LINE OFFICIAL: @467dlpti</a>
    </footer>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5mil7Axii3dSqUOAnU_Xd--hIp9ErKbfuw41vuPlOvPpt9tdZT2I6ZjmiU0No192j/exec";
    const btn = document.getElementById("btnRedeem");
    const input = document.getElementById("codeInput");
    const frame = document.getElementById("inputFrame");
    const resultArea = document.getElementById("resultContainer");

    // ระบบแจ้งเตือนเมื่อไม่กรอกโค้ด
    btn.addEventListener("click", async () => {
      const codeValue = input.value.trim();
      
      if (!codeValue) {
        // ระบบสั่น (สำหรับมือถือที่รองรับ)
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 100]);
        }
        
        // เอฟเฟกต์สั่นที่หน้าจอ
        frame.classList.add("shake");
        const originalText = btn.innerHTML;
        btn.innerHTML = "กรุณากรอกรหัสก่อนนะคะ";
        btn.style.background = "#d68a8a";

        setTimeout(() => {
          frame.classList.remove("shake");
          btn.innerHTML = originalText;
          btn.style.background = "";
        }, 1500);
        return;
      }

      // เริ่มกระบวนการรับสินค้า
      btn.disabled = true;
      btn.innerHTML = "กำลังตรวจสอบรหัส...";
      resultArea.innerHTML = "";

      try {
        const res = await fetch(`${API_URL}?action=redeem&text=${encodeURIComponent(codeValue)}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "result-box";
            div.innerHTML = `
              <div style="font-size:0.7rem; font-weight:800; color:#bca08e; margin-bottom:10px; text-transform:uppercase;">Product Success</div>
              <div style="font-weight:600; line-height:1.6;">${item.reply}</div>
              <button class="btn-copy-bear" onclick="copyResult('${item.reply.replace(/\n/g, "\\n")}', this)">คัดลอกรหัสสินค้า</button>
            `;
            resultArea.appendChild(div);
          });
          window.scrollTo({ top: resultArea.offsetTop - 20, behavior: 'smooth' });
        } else {
          showError("ไม่พบข้อมูลรหัสนี้ในระบบค่ะ");
        }
      } catch (e) {
        showError("การเชื่อมต่อมีปัญหา โปรดลองใหม่ค่ะ");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "รับสินค้าแจ้งโค้ด";
      }
    });

    function showError(msg) {
        resultArea.innerHTML = `<div style="text-align:center; color:#d68a8a; font-weight:700; font-size:0.85rem;">${msg}</div>`;
        if (navigator.vibrate) navigator.vibrate(200);
    }

    function copyResult(text, el) {
      navigator.clipboard.writeText(text.replace(/\\n/g, "\n")).then(() => {
        const old = el.innerHTML;
        el.innerHTML = "คัดลอกเรียบร้อยแล้ว";
        el.style.borderColor = "#90beaa";
        el.style.color = "#90beaa";
        setTimeout(() => {
          el.innerHTML = old;
          el.style = "";
        }, 2000);
      });
    }

    // กันรีเฟรชหน้าจอ
    window.onbeforeunload = function() {
      if (resultArea.children.length > 0) return "รหัสสินค้าจะหายไปหากคุณรีเฟรชหน้าจอ!";
    };
  </script>
</body>
</html>
