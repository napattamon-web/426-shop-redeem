<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>426 SHOP – Modern Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: rgba(255, 255, 255, 0.85);
      --accent: #ff9fb2;
      --accent-soft: #fff0f3;
      --text-main: #4a3f35;
      --text-sub: #a39387;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      font-family: 'Anuphan', sans-serif;
      background: #fdfaf8;
      /* เพิ่ม Texture พื้นหลังให้ดูพรีเมียม */
      background-image: radial-gradient(#ffe4e9 0.8px, transparent 0.8px);
      background-size: 24px 24px;
      color: var(--text-main);
      display: flex; justify-content: center; min-height: 100vh;
    }

    .app-container {
      width: 100%; max-width: 440px;
      padding: 40px 20px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* Header Modern Style */
    .brand-section {
      text-align: center; margin-bottom: 20px;
    }
    .brand-logo {
      width: 64px; height: 64px; background: white; border-radius: 20px;
      margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.04);
      font-size: 28px;
    }
    .brand-section h1 { font-size: 1.5rem; margin: 0; font-weight: 800; letter-spacing: -0.5px; }
    .brand-section p { font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 4px; margin-top: 4px; }

    /* Bento Box Design */
    .bento-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .bento-item {
      background: var(--card-bg); backdrop-filter: blur(10px);
      border-radius: 24px; padding: 16px;
      border: 1px solid white; box-shadow: 0 8px 30px rgba(0,0,0,0.02);
    }
    .full-width { grid-column: span 2; }

    /* Warning Banner - Modern Pulse */
    .status-alert {
      display: flex; align-items: center; gap: 10px; font-size: 0.8rem;
      color: #e57373; font-weight: 700;
    }
    .pulse-dot {
      width: 8px; height: 8px; background: #e57373; border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

    /* Input Styling */
    .input-group { position: relative; }
    textarea {
      width: 100%; height: 110px; border: none; background: transparent;
      font-family: inherit; font-size: 1rem; color: var(--text-main);
      resize: none; outline: none; padding: 0;
    }
    textarea::placeholder { color: #ccc; }

    .btn-action {
      width: 100%; padding: 18px; border-radius: 22px; border: none;
      background: var(--text-main); color: white;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-action:hover { transform: scale(1.02); background: #000; }
    .btn-action:active { transform: scale(0.98); }

    /* Result Cards */
    .result-card {
      background: white; border-radius: 24px; padding: 20px;
      margin-top: 12px; border: 1px solid #f1f3f5;
      animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } }

    .tag-premium {
      background: var(--accent-soft); color: var(--accent);
      padding: 4px 10px; border-radius: 10px; font-size: 0.7rem; font-weight: 800;
    }

    .btn-copy-modern {
      width: 100%; padding: 12px; margin-top: 15px; border-radius: 16px;
      border: 1.5px solid #eee; background: white; color: var(--text-main);
      font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s;
    }
    .btn-copy-modern:hover { border-color: var(--accent); color: var(--accent); }

    /* Footer */
    footer { text-align: center; padding: 20px 0; margin-top: auto; }
    .social-badge {
      display: inline-flex; align-items: center; padding: 8px 16px;
      background: white; border-radius: 999px; font-size: 0.8rem;
      color: #06c755; text-decoration: none; font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="brand-section">
      <div class="brand-logo">🧸</div>
      <h1>426 SHOP</h1>
      <p>Premium Access</p>
    </header>

    <div class="bento-grid">
      <div class="bento-item full-width" style="padding: 12px 20px;">
        <div class="status-alert">
          <div class="pulse-dot"></div>
          ⚠️ ห้ามรีเฟรชหน้าจอ ข้อมูลจะหายทันที
        </div>
      </div>

      <div class="bento-item full-width">
        <div class="input-group">
          <textarea id="codeInput" placeholder="วางโค้ดสินค้าที่ได้รับจากแอดมิน..."></textarea>
        </div>
      </div>

      <div class="full-width">
        <button class="btn-action" id="btnRedeem">
          <span>รับสินค้าทันที</span>
          <span style="font-size: 18px;">✨</span>
        </button>
      </div>

      <div class="bento-item" style="display: flex; align-items: center; justify-content: center; text-align: center;">
        <span style="font-size: 0.7rem; font-weight: 700; color: var(--text-sub);">🔐 ปลอดภัย 100%</span>
      </div>
      <div class="bento-item" style="display: flex; align-items: center; justify-content: center; text-align: center;">
        <span style="font-size: 0.7rem; font-weight: 700; color: var(--text-sub);">⚡️ รับไวใน 1 วิ</span>
      </div>
    </div>

    <div id="results"></div>

    <footer>
      <a href="https://line.me/ti/p/@467dlpti" class="social-badge">
        Support: @467dlpti
      </a>
      <div style="font-size: 0.6rem; color: #ccc; margin-top: 15px; font-weight: 700; letter-spacing: 1px;">
        EST 2024 • 426 SHOP
      </div>
    </footer>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5mil7Axii3dSqUOAnU_Xd--hIp9ErKbfuw41vuPlOvPpt9tdZT2I6ZjmiU0No192j/exec";
    const btn = document.getElementById("btnRedeem");
    const input = document.getElementById("codeInput");
    const resultsArea = document.getElementById("results");

    window.onbeforeunload = function() {
      if (resultsArea.children.length > 0) return "ข้อมูลรหัสจะหายไปนะคะ!";
    };

    btn.addEventListener("click", async () => {
      const code = input.value.trim();
      if (!code) return;

      btn.disabled = true;
      btn.innerHTML = "กำลังตรวจสอบ... ⏳";
      resultsArea.innerHTML = "";

      try {
        const res = await fetch(`${API_URL}?action=redeem&text=${encodeURIComponent(code)}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const card = document.createElement("div");
            card.className = "result-card";
            card.innerHTML = `
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span class="tag-premium">${item.appName || 'Premium'}</span>
                <span style="font-size:0.65rem; color:#ccc; font-weight:700;">#${item.code.substring(0,4)}</span>
              </div>
              <div style="font-weight:600; line-height:1.6; font-size:0.95rem;">${item.reply}</div>
              <button class="btn-copy-modern">คัดลอกรายละเอียด 📋</button>
            `;
            card.querySelector("button").onclick = (e) => copyAction(item.reply, e.target);
            resultsArea.appendChild(card);
          });
        } else {
          resultsArea.innerHTML = `<div style="text-align:center; padding:20px; font-size:0.8rem; color:#e57373; font-weight:700;">ไม่พบรหัสสินค้า หรือรหัสถูกใช้งานแล้วค่ะ 🥺</div>`;
        }
      } catch (e) {
        resultsArea.innerHTML = `<div style="text-align:center; padding:20px; font-size:0.8rem; color:#e57373;">เกิดข้อผิดพลาดในการเชื่อมต่อ</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>รับสินค้าทันที</span><span style='font-size: 18px;'>✨</span>";
      }
    });

    function copyAction(text, el) {
      navigator.clipboard.writeText(text).then(() => {
        const original = el.innerHTML;
        el.innerHTML = "คัดลอกเรียบร้อย! ✨";
        el.style.color = "#90beaa";
        el.style.borderColor = "#90beaa";
        setTimeout(() => {
          el.innerHTML = original;
          el.style = "";
        }, 2000);
      });
    }
  </script>
</body>
</html>
