<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>426 SHOP – Premium Cute Redeem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-pink: #ffdae9;
      --soft-peach: #fff0db;
      --text-main: #6b4f3f;
      --accent-grad: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      --glass-bg: rgba(255, 255, 255, 0.7);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      font-family: 'Anuphan', sans-serif;
      color: var(--text-main);
      background: #fff9f5;
      /* พื้นหลังแบบไล่สีฟุ้งๆ */
      background-image: 
        radial-gradient(at 0% 0%, #ffedf4 0px, transparent 50%),
        radial-gradient(at 100% 0%, #fff4e1 0px, transparent 50%),
        radial-gradient(at 100% 100%, #e8f5ff 0px, transparent 50%),
        radial-gradient(at 0% 100%, #fff0f5 0px, transparent 50%);
      min-height: 100vh;
      display: flex; justify-content: center; overflow-x: hidden;
    }

    .container {
      width: 100%; max-width: 450px;
      margin: 40px 15px;
      position: relative;
    }

    /* ตกแต่งพื้นหลังลอยๆ */
    .floating-deco {
      position: absolute; z-index: -1; animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(10px, -20px) rotate(10deg); }
    }

    /* Header Design */
    .header { text-align: center; margin-bottom: 30px; }
    .logo-wrapper {
      position: relative; width: 110px; height: 110px; margin: 0 auto 15px;
    }
    .logo-main {
      width: 100%; height: 100%; background: #fff; border-radius: 40px;
      padding: 10px; box-shadow: 0 20px 40px rgba(255, 154, 158, 0.2);
      transform: rotate(-5deg); transition: 0.5s;
    }
    .logo-main:hover { transform: rotate(0deg) scale(1.05); }
    
    .bear-head {
      width: 100%; height: 100%; background: var(--soft-peach); border-radius: 32px;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .bear-ear-l, .bear-ear-r {
      width: 25px; height: 25px; background: var(--soft-peach); border-radius: 50%;
      position: absolute; top: -5px;
    }
    .bear-ear-l { left: 10px; } .bear-ear-r { right: 10px; }

    .header h1 { font-size: 1.8rem; margin: 0; font-weight: 800; color: #5a4637; letter-spacing: -0.5px; }
    .header .subtitle { font-size: 0.8rem; font-weight: 700; color: #d4a5a5; letter-spacing: 5px; text-transform: uppercase; }

    /* Glass Card */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 35px;
      padding: 30px 25px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 25px 50px -12px rgba(138, 106, 79, 0.1);
    }

    .system-status {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 0.8rem; font-weight: 700; color: #90beaa; margin-bottom: 20px;
    }
    .status-dot { width: 8px; height: 8px; background: #90beaa; border-radius: 50%; box-shadow: 0 0 10px #90beaa; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Input Styling */
    .input-group { margin-bottom: 20px; }
    .label { font-size: 0.95rem; font-weight: 700; color: #8a6a4f; margin-left: 10px; margin-bottom: 8px; display: block; }
    
    .input-box {
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid #f1ece8;
      border-radius: 25px;
      padding: 20px;
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .input-box:focus-within {
      background: #fff;
      border-color: #ffb7ce;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 183, 206, 0.15);
    }
    textarea {
      width: 100%; height: 100px; border: none; background: transparent;
      font-family: inherit; font-size: 1rem; color: #5a4637; resize: none;
    }

    /* Button */
    .btn-redeem {
      width: 100%;
      padding: 18px;
      border-radius: 25px;
      border: none;
      background: var(--accent-grad);
      color: white;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 154, 158, 0.3);
      transition: 0.3s;
    }
    .btn-redeem:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 30px rgba(255, 154, 158, 0.4); }
    .btn-redeem:active { transform: translateY(0) scale(0.98); }
    .btn-redeem:disabled { filter: grayscale(0.8); cursor: not-allowed; }

    /* Result Items */
    .result-container { margin-top: 25px; }
    .item-card {
      background: #fff;
      border-radius: 25px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid #f9f0ea;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    .app-tag {
      display: inline-block; padding: 4px 12px; border-radius: 12px;
      background: #f0f7ff; color: #5a9fff; font-size: 0.7rem; font-weight: 800; margin-bottom: 10px;
    }
    .code-text { font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; margin-bottom: 15px; }

    .btn-copy-small {
      width: 100%; padding: 12px; border-radius: 15px; border: 1.5px solid #f1ece8;
      background: #fff; color: #8a6a4f; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .btn-copy-small:hover { border-color: #ffb7ce; color: #ffb7ce; background: #fffafb; }

    /* Warning Overlay */
    .reload-warning {
      background: #fff0f0; border-radius: 20px; padding: 12px; 
      margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
    }

    footer { text-align: center; margin-top: 40px; }
    .line-contact {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 25px; background: #fff; border-radius: 999px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05); color: #06c755; text-decoration: none; font-weight: 700;
    }

    /* Shake animation */
    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  </style>
</head>
<body>

  <div class="container">
    <span class="floating-deco" style="top: -20px; left: -30px; font-size: 40px;">🧸</span>
    <span class="floating-deco" style="top: 100px; right: -40px; font-size: 30px; animation-delay: 1s;">✨</span>
    <span class="floating-deco" style="bottom: 50px; left: -40px; font-size: 25px; animation-delay: 2s;">🎀</span>

    <header class="header">
      <div class="logo-wrapper">
        <div class="logo-main">
          <div class="bear-head">
            <div class="bear-ear-l"></div>
            <div class="bear-ear-r"></div>
            <div style="width: 6px; height: 6px; background: #3b291e; border-radius: 50%; position: absolute; top: 38px; left: 30px;"></div>
            <div style="width: 6px; height: 6px; background: #3b291e; border-radius: 50%; position: absolute; top: 38px; right: 30px;"></div>
            <div style="width: 10px; height: 7px; background: #3b291e; border-radius: 50%; position: absolute; top: 48px;"></div>
          </div>
        </div>
      </div>
      <h1>426 SHOP</h1>
      <div class="subtitle">Premium Access</div>
    </header>

    <div class="glass-card">
      <div class="system-status">
        <span class="status-dot"></span>
        <span>Redeem System Online</span>
      </div>

      <div class="reload-warning">
        <span style="font-size: 24px;">🚫</span>
        <div style="font-size: 0.75rem; color: #d65a5a; font-weight: 700;">ห้ามรีเฟรชหน้าจอนะคะ <br> มิเช่นนั้นข้อมูลรหัสจะหายไปค่ะ!</div>
      </div>

      <div class="input-group">
        <label class="label">วางโค้ดตรงนี้เลยค่ะ ☁️</label>
        <div class="input-box" id="boxEffect">
          <textarea id="codeInput" placeholder="ตัวอย่าง...&#10;NFX-12345678&#10;DSN-87654321"></textarea>
        </div>
      </div>

      <button class="btn-redeem" id="btnRedeem">รับสินค้าทันที ✨</button>

      <div id="statusArea"></div>
      <div class="result-container" id="results"></div>
    </div>

    <footer>
      <a href="https://line.me/ti/p/@467dlpti" class="line-contact">
        <span>LINE: @467dlpti</span>
      </a>
      <p style="font-size: 0.7rem; color: #bca08e; margin-top: 15px; font-weight: 700;">EST. 2024 • COZY REDEEM CENTER</p>
    </footer>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5mil7Axii3dSqUOAnU_Xd--hIp9ErKbfuw41vuPlOvPpt9tdZT2I6ZjmiU0No192j/exec";
    const btn = document.getElementById("btnRedeem");
    const input = document.getElementById("codeInput");
    const resultsArea = document.getElementById("results");
    const statusArea = document.getElementById("statusArea");

    // กันรีเฟรช
    window.onbeforeunload = function() {
      if (resultsArea.children.length > 0) return "คุณจะเสียข้อมูลรหัสไปนะคะ ก๊อปปี้หรือยังเอ่ย?";
    };

    btn.addEventListener("click", async () => {
      const code = input.value.trim();
      if (!code) {
        document.getElementById("boxEffect").classList.add("shake");
        setTimeout(() => document.getElementById("boxEffect").classList.remove("shake"), 400);
        return;
      }

      btn.disabled = true;
      btn.innerHTML = "กำลังดึงข้อมูล... 🧸";
      statusArea.innerHTML = "<div style='text-align:center; margin-top:15px; font-size:0.8rem; font-weight:700;'>⏳ รอสักครู่นะคะคนดี...</div>";
      resultsArea.innerHTML = "";

      try {
        const res = await fetch(`${API_URL}?action=redeem&text=${encodeURIComponent(code)}`);
        const data = await res.json();
        
        statusArea.innerHTML = "";
        if (data.ok) {
          renderData(data);
        } else {
          statusArea.innerHTML = `<div style='color:#ff8b8b; text-align:center; margin-top:15px; font-weight:700;'>⚠️ ${data.message || 'พบข้อผิดพลาด'}</div>`;
        }
      } catch (e) {
        statusArea.innerHTML = "<div style='color:red; text-align:center; margin-top:15px;'>เกิดข้อผิดพลาดในการเชื่อมต่อค่ะ</div>";
      } finally {
        btn.disabled = false;
        btn.innerHTML = "รับสินค้าทันที ✨";
      }
    });

    function renderData(data) {
      if (data.items && data.items.length > 0) {
        // ปุ่ม Copy All
        if(data.items.length > 1) {
            const copyAll = document.createElement("button");
            copyAll.className = "btn-redeem";
            copyAll.style.background = "#fff";
            copyAll.style.color = "#ff9a9e";
            copyAll.style.border = "2px solid #ff9a9e";
            copyAll.style.marginBottom = "20px";
            copyAll.innerHTML = "📋 คัดลอกสินค้าทั้งหมด";
            copyAll.onclick = () => {
                const totalText = data.items.map(i => `[${i.appName}]\n${i.reply}`).join('\n\n---\n\n');
                copyAction(totalText, copyAll, "คัดลอกทั้งหมดแล้ว! ✅");
            };
            resultsArea.appendChild(copyAll);
        }

        data.items.forEach(item => {
          const card = document.createElement("div");
          card.className = "item-card";
          card.innerHTML = `
            ${item.appName ? `<span class="app-tag">${item.appName}</span>` : ''}
            <div class="code-text">${item.reply}</div>
            <button class="btn-copy-small">คัดลอกรายการนี้ 📋</button>
          `;
          card.querySelector("button").onclick = (e) => copyAction(item.reply, e.target);
          resultsArea.appendChild(card);
        });
        window.scrollTo({ top: resultsArea.offsetTop, behavior: 'smooth' });
      }
    }

    function copyAction(text, btnEl, successText = "คัดลอกแล้ว! ✨") {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnEl.innerHTML;
        btnEl.innerHTML = successText;
        btnEl.style.color = "#90beaa";
        btnEl.style.borderColor = "#90beaa";
        setTimeout(() => {
          btnEl.innerHTML = originalText;
          btnEl.style.color = "";
          btnEl.style.borderColor = "";
        }, 2000);
      });
    }
  </script>
</body>
</html>
