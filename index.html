<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>426 SHOP – Official Redeem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-brown: #8e735b;    /* น้ำตาลพาสเทลเข้ม */
      --soft-brown: #bca08e;       /* น้ำตาลนมอ่อน */
      --cream-bg: #fdfaf7;         /* ครีมพาสเทล */
      --white: #ffffff;
      --accent-sand: #f3ece5;      /* สีทรายอ่อน */
      --danger-soft: #d68a8a;      /* แดงพาสเทลสำหรับคำเตือน */
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      font-family: 'Anuphan', sans-serif;
      background-color: var(--cream-bg);
      color: var(--primary-brown);
      display: flex; justify-content: center; min-height: 100vh;
    }

    .app-container {
      width: 100%; max-width: 420px;
      padding: 50px 20px;
      display: flex; flex-direction: column; gap: 24px;
    }

    /* Header Section */
    .header { text-align: center; margin-bottom: 10px; }
    .brand-name {
      font-size: 2rem; font-weight: 800; letter-spacing: 2px;
      color: var(--primary-brown); margin: 0;
    }
    .status-line {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 10px; font-size: 0.75rem; font-weight: 700;
      color: var(--soft-brown); letter-spacing: 1px;
    }
    .dot-live { width: 6px; height: 6px; background: #90beaa; border-radius: 50%; }

    /* Main Service Card */
    .service-card {
      background: var(--white); border-radius: 30px;
      padding: 35px 25px;
      box-shadow: 0 15px 35px rgba(142, 115, 91, 0.08);
      border: 1px solid var(--accent-sand);
    }

    .alert-text {
      font-size: 0.75rem; color: var(--danger-soft);
      text-align: center; font-weight: 700; margin-bottom: 25px;
      padding: 10px; background: #fff8f8; border-radius: 12px;
    }

    /* Input Styling */
    .field-label {
      font-size: 0.85rem; font-weight: 700; margin-bottom: 12px;
      display: block; color: var(--soft-brown); text-transform: uppercase;
    }
    
    .input-group {
      background: var(--cream-bg); border-radius: 18px;
      padding: 20px; border: 1.5px solid transparent; transition: 0.3s;
    }
    .input-group:focus-within {
      background: var(--white); border-color: var(--soft-brown);
      box-shadow: 0 8px 20px rgba(188, 160, 142, 0.15);
    }
    textarea {
      width: 100%; height: 90px; border: none; background: transparent;
      font-family: inherit; font-size: 1rem; color: var(--primary-brown);
      resize: none; outline: none; padding: 0;
    }

    /* Premium Button */
    .btn-submit {
      width: 100%; padding: 20px; margin-top: 25px; border-radius: 20px;
      border: none; background: var(--primary-brown); color: var(--white);
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 1px;
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { background: var(--accent-sand); color: var(--soft-brown); }

    /* Action Links (ความสะดวกลูกค้า) */
    .quick-nav {
      display: flex; justify-content: space-between; margin-top: 15px;
    }
    .nav-link {
      background: none; border: none; font-size: 0.75rem; font-weight: 700;
      color: var(--soft-brown); cursor: pointer; padding: 5px;
    }

    /* Results */
    #resultArea { margin-top: 20px; }
    .item-result {
      background: var(--white); border-radius: 24px; padding: 25px;
      margin-bottom: 16px; border: 1px solid var(--accent-sand);
      animation: fadeIn 0.5s ease-out forwards;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .item-tag {
      font-size: 0.65rem; font-weight: 800; color: var(--primary-brown);
      background: var(--accent-sand); padding: 4px 12px; border-radius: 8px;
      margin-bottom: 12px; display: inline-block;
    }
    .item-content { font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }

    .btn-copy {
      width: 100%; padding: 14px; border-radius: 14px; border: 1.5px solid var(--accent-sand);
      background: var(--white); color: var(--primary-brown);
      font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: 0.2s;
    }
    .btn-copy:hover { background: var(--accent-sand); }

    footer { text-align: center; margin-top: auto; padding: 40px 0; }
    .contact-line {
      font-size: 0.85rem; color: var(--primary-brown); text-decoration: none;
      font-weight: 700; border-bottom: 1px solid var(--soft-brown);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1 class="brand-name">426 SHOP</h1>
      <div class="status-line">
        <span class="dot-live"></span> ONLINE 24 HOURS
      </div>
    </header>

    <main class="service-card">
      <div class="alert-text">โปรดคัดลอกรหัสไว้ทันที ห้ามรีเฟรชหน้าจอ</div>
      
      <label class="field-label">ระบุรหัสเพื่อรับสินค้า</label>
      <div class="input-group">
        <textarea id="codeInput" placeholder="วางโค้ดแจ้งรับสินค้าที่นี่..."></textarea>
      </div>

      <button class="btn-submit" id="btnRedeem">รับสินค้าทันที</button>

      <div class="quick-nav">
        <button class="nav-link" onclick="document.getElementById('codeInput').value=''">ล้างข้อมูล</button>
        <button class="nav-link" onclick="location.href='https://line.me/ti/p/@467dlpti'">แจ้งปัญหา</button>
      </div>
    </main>

    <div id="resultArea"></div>

    <footer>
      <a href="https://line.me/ti/p/@467dlpti" class="contact-line">LINE: @467dlpti</a>
      <p style="font-size: 0.65rem; color: var(--soft-brown); margin-top: 15px; font-weight: 500;">PREMIUM DIGITAL SERVICE SYSTEM</p>
    </footer>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5mil7Axii3dSqUOAnU_Xd--hIp9ErKbfuw41vuPlOvPpt9tdZT2I6ZjmiU0No192j/exec";
    const btn = document.getElementById("btnRedeem");
    const input = document.getElementById("codeInput");
    const results = document.getElementById("resultArea");

    window.onbeforeunload = function() {
      if (results.children.length > 0) return "ข้อมูลรหัสสินค้าจะหายไปหากคุณออกตอนนี้";
    };

    btn.addEventListener("click", async () => {
      const code = input.value.trim();
      if (!code) return;

      btn.disabled = true;
      btn.innerHTML = "กำลังตรวจสอบระบบ...";
      results.innerHTML = "";

      try {
        const res = await fetch(`${API_URL}?action=redeem&text=${encodeURIComponent(code)}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "item-result";
            div.innerHTML = `
              <span class="item-tag">${item.appName || 'PRODUCT'}</span>
              <div class="item-content">${item.reply}</div>
              <button class="btn-copy">คัดลอกข้อมูลสินค้า</button>
            `;
            div.querySelector("button").onclick = (e) => copyToClipboard(item.reply, e.target);
            results.appendChild(div);
          });
          window.scrollTo({ top: results.offsetTop - 20, behavior: 'smooth' });
        } else {
          results.innerHTML = `<div style="text-align:center; padding:20px; font-size:0.8rem; color:var(--danger-soft); font-weight:700;">ไม่พบรหัสสินค้าในระบบ</div>`;
        }
      } catch (e) {
        results.innerHTML = `<div style="text-align:center; padding:20px; font-size:0.8rem; color:var(--danger-soft);">การเชื่อมต่อขัดข้อง</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = "รับสินค้าทันที";
      }
    });

    function copyToClipboard(text, el) {
      navigator.clipboard.writeText(text).then(() => {
        const original = el.innerHTML;
        el.innerHTML = "คัดลอกสำเร็จ";
        el.style.background = "#f3fdf9";
        el.style.borderColor = "#90beaa";
        el.style.color = "#4d8066";
        setTimeout(() => {
          el.innerHTML = original;
          el.style = "";
        }, 2000);
      });
    }
  </script>
</body>
</html>
