<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>426 SHOP – Cute & Cozy System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-bear: #8e735b;
      --soft-cream: #fdf8f5;
      --strawberry-milk: #ffb7ce;
      --choco-dark: #5a4637;
      --white: #ffffff;
      --error-pink: #ff6b8a;
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      font-family: 'Anuphan', sans-serif; 
    }

    body {
      margin: 0; padding: 0;
      background-color: var(--soft-cream);
      color: var(--choco-dark);
      /* พื้นหลังลายตารางจางๆ เหมือนสมุดบันทึก */
      background-image: radial-gradient(var(--strawberry-milk) 0.8px, transparent 0.8px);
      background-size: 25px 25px;
      min-height: 100vh;
      display: flex; justify-content: center;
    }

    .app-container {
      width: 100%; max-width: 450px;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex; flex-direction: column; gap: 15px;
    }

    /* Branding Section */
    .header { text-align: center; padding: 10px 0; }
    .brand-title {
      font-size: 3rem; font-weight: 800; color: var(--primary-bear);
      margin: 0; letter-spacing: -1.5px; transform: rotate(-1.5deg);
    }
    .status-badge {
      display: inline-block; background: var(--white);
      padding: 6px 18px; border-radius: 99px;
      font-size: 0.8rem; font-weight: 800; color: #90beaa;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-top: 8px;
    }

    /* แถบแจ้งเตือนกระพริบดึงดูดสายตา */
    .warning-blink {
      background: var(--error-pink); color: white;
      padding: 15px; border-radius: 25px;
      text-align: center; font-weight: 800; font-size: 0.9rem;
      box-shadow: 0 10px 20px rgba(255, 107, 138, 0.2);
      animation: pulse-warn 2s infinite;
    }
    @keyframes pulse-warn {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.97); opacity: 0.9; }
    }

    /* กล่องหลักแบบ Full Screen Feel */
    .main-card {
      background: var(--white);
      border-radius: 45px;
      padding: 40px 25px;
      border: 4px solid var(--primary-bear);
      box-shadow: 0 15px 0 var(--primary-bear); /* เงาหนาสไตล์ 3D */
      flex-grow: 1;
      display: flex; flex-direction: column; justify-content: center;
      position: relative;
    }

    /* กรอบกรอกรหัสที่ "ชัดเจน" และ "น่ารัก" */
    .input-frame {
      background: var(--soft-cream);
      border: 3px dashed var(--strawberry-milk);
      border-radius: 35px;
      padding: 25px;
      transition: 0.3s;
      margin-top: 10px;
    }
    .input-frame:focus-within {
      border-style: solid;
      border-color: var(--primary-bear);
      background: white;
      transform: translateY(-5px);
    }

    textarea {
      width: 100%; height: 130px; border: none; background: transparent;
      font-size: 1.4rem; font-weight: 700; color: var(--choco-dark);
      text-align: center; outline: none; resize: none;
    }
    textarea::placeholder { color: #d4c4b5; font-weight: 400; }

    /* ปุ่มกดตัวโต นุบนิบสะดุดตา */
    .btn-submit {
      width: 100%; padding: 22px; margin-top: 30px; border-radius: 30px;
      border: none; background: var(--primary-bear); color: white;
      font-size: 1.5rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 0 var(--choco-dark);
      transition: 0.1s;
    }
    .btn-submit:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--choco-dark); }
    .btn-submit:disabled { background: #ccc; box-shadow: 0 4px 0 #999; }

    /* ผลลัพธ์รหัสสินค้า */
    #resultArea { margin-top: 25px; }
    .result-bubble {
      background: white; border-radius: 40px; padding: 30px;
      border: 3px solid var(--strawberry-milk);
      margin-bottom: 20px; animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popUp { from { opacity: 0; transform: scale(0.8); } }

    .btn-copy {
      width: 100%; padding: 15px; margin-top: 15px; border-radius: 20px;
      border: 2px solid var(--soft-cream); background: var(--soft-cream);
      color: var(--primary-bear); font-weight: 800; cursor: pointer;
    }

    /* เอฟเฟกต์สั่นเมื่อกรอกผิด */
    .shake { animation: shake-ani 0.4s ease-in-out; border-color: var(--error-pink) !important; }
    @keyframes shake-ani {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    footer { text-align: center; padding: 40px 0; font-weight: 700; color: var(--primary-bear); }
    .link-item { color: var(--primary-bear); text-decoration: underline; cursor: pointer; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1 class="brand-title">426 SHOP</h1>
      <div class="status-badge">ONLINE 24 HOURS</div>
    </header>

    <div class="warning-blink">
      ระวัง! ห้ามรีเฟรชหน้าจอ ข้อมูลจะหายทันที
    </div>

    <main class="main-card">
      <div style="text-align:center; font-weight:800; color:var(--primary-bear); margin-bottom:15px;">
        วางโค้ดรับสินค้าตรงนี้เลยน้า 🧸
      </div>
      
      <div class="input-frame" id="inputFrame">
        <textarea id="codeInput" placeholder="กรอกโค้ดที่แอดมินส่งให้..."></textarea>
      </div>

      <button class="btn-submit" id="btnGo">รับสินค้าแจ้งโค้ด</button>
      
      <div style="display: flex; justify-content: space-between; margin-top: 20px; padding: 0 10px;">
        <span class="link-item" onclick="document.getElementById('codeInput').value=''">ล้างข้อมูล</span>
        <span class="link-item" onclick="location.href='https://line.me/ti/p/@467dlpti'">ติดต่อแอดมิน</span>
      </div>
    </main>

    <div id="resultArea"></div>

    <footer>
      LINE OFFICIAL: @467dlpti
    </footer>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5mil7Axii3dSqUOAnU_Xd--hIp9ErKbfuw41vuPlOvPpt9tdZT2I6ZjmiU0No192j/exec";
    const btn = document.getElementById("btnGo");
    const input = document.getElementById("codeInput");
    const frame = document.getElementById("inputFrame");
    const resultArea = document.getElementById("resultArea");

    // ระบบแจ้งเตือนกันรีเฟรช
    window.onbeforeunload = function() {
      if (resultArea.children.length > 0) return "ข้อมูลสินค้าจะหายไปหากคุณออกจากหน้านี้!";
    };

    btn.addEventListener("click", async () => {
      const code = input.value.trim();
      
      // ระบบตรวจสอบ: หากไม่กรอกโค้ด
      if (!code) {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // สั่นเครื่อง
        frame.classList.add("shake");
        const oldText = btn.innerHTML;
        btn.innerHTML = "ลืมใส่โค้ดหรือเปล่าคะ?";
        btn.style.background = "#ff6b8a";

        setTimeout(() => {
          frame.classList.remove("shake");
          btn.innerHTML = oldText;
          btn.style.background = "";
        }, 1500);
        return;
      }

      // เริ่มการทำงาน
      btn.disabled = true;
      btn.innerHTML = "รอสักครู่... กำลังดึงข้อมูล ✨";
      resultArea.innerHTML = "";

      try {
        const res = await fetch(`${API_URL}?action=redeem&text=${encodeURIComponent(code)}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "result-bubble";
            div.innerHTML = `
              <div style="font-size:0.8rem; font-weight:800; color:#ffb7ce; margin-bottom:10px;">SUCCESS! ได้รับสินค้าแล้วค่า</div>
              <div style="font-weight:700; line-height:1.6; font-size:1.2rem;">${item.reply}</div>
              <button class="btn-copy" onclick="copyResult('${item.reply.replace(/\n/g, "\\n")}', this)">คัดลอกข้อมูล 📋</button>
            `;
            resultArea.appendChild(div);
          });
          window.scrollTo({ top: resultArea.offsetTop - 30, behavior: 'smooth' });
        } else {
          showErr("ไม่พบรหัสสินค้าในระบบค่ะ 🥺");
        }
      } catch (e) {
        showErr("ระบบขัดข้อง โปรดลองใหม่นะคะ");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "รับสินค้าแจ้งโค้ด";
      }
    });

    function showErr(msg) {
      resultArea.innerHTML = `<div style="text-align:center; padding:20px; font-weight:800; color:#ff6b8a;">${msg}</div>`;
      if (navigator.vibrate) navigator.vibrate(200);
    }

    function copyResult(text, el) {
      navigator.clipboard.writeText(text.replace(/\\n/g, "\n")).then(() => {
        const original = el.innerHTML;
        el.innerHTML = "คัดลอกสำเร็จแล้ว! ✅";
        el.style.color = "#90beaa";
        el.style.background = "#fff";
        setTimeout(() => {
          el.innerHTML = original;
          el.style = "";
        }, 2000);
      });
    }
  </script>
</body>
</html>
