<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>426 Chocolate Shop – Redeem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Palette: Sweet Chocolate */
      --dark-choco: #5a4637;    /* ช็อกโกแลตเข้ม */
      --milk-choco: #8a6a4f;    /* ช็อกโกแลตหน้านม */
      --soft-cream: #fff8f0;    /* ครีมละมุน */
      --strawberry: #f2b6c7;    /* ชมพูสตรอว์เบอร์รี */
      --white: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      font-family: 'Anuphan', sans-serif;
      color: var(--dark-choco);
      /* พื้นหลังลายตารางจางๆ เหมือนกระดาษห่อขนม */
      background-color: var(--soft-cream);
      background-image: repeating-linear-gradient(45deg, #fdf1e1 25%, transparent 25%, transparent 75%, #fdf1e1 75%, #fdf1e1), repeating-linear-gradient(45deg, #fdf1e1 25%, #fff8f0 25%, #fff8f0 75%, #fdf1e1 75%, #fdf1e1);
      background-position: 0 0, 10px 10px;
      background-size: 20px 20px;
      display: flex; justify-content: center; min-height: 100vh;
    }

    .app-wrapper {
      width: 100%; max-width: 420px;
      padding: 40px 15px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* Header: สไตล์ป้ายหน้าร้านขนม */
    .shop-header {
      text-align: center; margin-bottom: 20px;
      background: var(--white); border-radius: 30px;
      padding: 25px; border: 4px solid var(--milk-choco);
      box-shadow: 0 10px 0 rgba(138, 106, 79, 0.2); /* เงาแบบนูนๆ น่ารัก */
    }
    .shop-logo {
      font-size: 40px; margin-bottom: 10px;
    }
    .shop-header h1 { 
      font-size: 1.8rem; margin: 0; font-weight: 800; 
      color: var(--dark-choco); letter-spacing: -0.5px;
      text-shadow: 1px 1px 0 var(--milk-choco); /* เอฟเฟกต์นูนเล็กน้อย */
    }
    .shop-header p { 
      font-size: 0.8rem; color: var(--milk-choco); 
      margin-top: 5px; text-transform: uppercase; 
      letter-spacing: 4px; font-weight: 700;
    }

    /* Info Banner: เตือนแบบนุบนิบ */
    .sweet-alert {
      background: var(--strawberry); color: var(--white);
      border-radius: 20px; padding: 15px 20px;
      font-size: 0.85rem; font-weight: 700;
      text-align: center; border: 3px solid var(--white);
      box-shadow: 0 5px 0 rgba(242, 182, 199, 0.3);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }

    /* Main Card: เหมือนกล่องใส่ช็อกโกแลต */
    .sweet-card {
      background: var(--white); border-radius: 30px;
      padding: 30px 25px;
      border: 3px solid #eee;
      box-shadow: 0 15px 30px rgba(90, 70, 55, 0.05);
    }

    .label-sweet { 
      font-size: 1rem; font-weight: 700; color: var(--dark-choco); 
      margin-left: 5px; margin-bottom: 12px; display: block; 
    }
    
    /* Input Area: ช่องวางรหัสสีครีมหน้านม */
    .input-wrapper {
      background: #faf7f3; border-radius: 20px; padding: 20px;
      border: 2px solid #f3ece5; transition: 0.3s;
    }
    .input-wrapper:focus-within {
      background: var(--white); border-color: var(--milk-choco);
      box-shadow: 0 10px 20px rgba(138, 106, 79, 0.1);
    }
    textarea {
      width: 100%; height: 100px; border: none; background: transparent;
      font-family: inherit; font-size: 1rem; color: var(--dark-choco);
      resize: none; outline: none; padding: 0;
    }
    textarea::placeholder { color: #d4c4b5; }

    /* Button: เหมือนช็อกโกแลตแท่ง */
    .btn-sweet {
      width: 100%; padding: 18px; margin-top: 20px; border-radius: 20px;
      border: none; background: var(--dark-choco); color: var(--soft-cream);
      font-size: 1.1rem; font-weight: 800; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-bottom: 5px solid #3b2d23; /* เพิ่มมิติเหมือนแท่งช็อกโกแลต */
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-sweet:hover { opacity: 0.95; transform: translateY(-2px); }
    .btn-sweet:active { transform: translateY(2px); border-bottom-width: 2px; }
    .btn-sweet:disabled { background: #d4c4b5; border-bottom: none; cursor: not-allowed; }

    /* Results: รายการสินค้าสไตล์มินิคาร์ด */
    #results { margin-top: 20px; display: flex; flex-direction: column; gap: 15px; }
    .result-item-sweet {
      background: var(--white); border-radius: 25px; padding: 20px;
      border: 2px solid #f3ece5;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.8); } }

    .tag-sweet {
      font-size: 0.7rem; font-weight: 800; color: var(--dark-choco);
      background: #f3ece5; padding: 4px 10px; border-radius: 10px;
      margin-bottom: 8px; display: inline-block;
    }
    .reply-text-sweet { 
      font-size: 0.95rem; line-height: 1.6; color: var(--dark-choco);
      font-weight: 500; margin-bottom: 15px; white-space: pre-wrap; 
    }

    .btn-copy-sweet {
      width: 100%; padding: 12px; border: 1px solid #f3ece5;
      border-radius: 12px; background: #faf7f3; color: var(--milk-choco);
      font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .btn-copy-sweet:hover { background: #f3ece5; color: var(--dark-choco); border-color: var(--dark-choco); }

    /* Footer: ลายนิ้วมือจางๆ */
    footer { text-align: center; padding: 30px 0; margin-top: auto; opacity: 0.6; }
    .line-link-sweet { font-size: 0.85rem; color: var(--milk-choco); text-decoration: none; font-weight: 700; }
    .copy-right-sweet { font-size: 0.65rem; color: var(--text-light); margin-top: 8px; font-weight: 700; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <header class="shop-header">
      <div class="shop-logo">🍫🍩</div>
      <h1>426 CHOCOLATE</h1>
      <p>Premium Redeem</p>
    </header>

    <div class="sweet-alert">
      <span>🚫 ห้ามรีเฟรชหน้าจอนะคะ ข้อมูลจะหายทันที!</span>
    </div>

    <main class="sweet-card">
      <label class="label-sweet">วางรหัสหวานๆ ตรงนี้ค่ะ ☁️</label>
      <div class="input-wrapper">
        <textarea id="codeInput" placeholder="ตัวอย่าง...&#10;CHOCO-1234&#10;SWEET-5678"></textarea>
      </div>
      <button class="btn-sweet" id="btnRedeem">
        <span>รับความหวาน</span>
        <span>🍪</span>
      </button>
    </main>

    <div id="results"></div>

    <footer>
      <a href="https://line.me/ti/p/@467dlpti" class="line-link-sweet">หวานใจ Support: @467dlpti</a>
      <div class="copy-right-sweet">© 2024-2026 426 CHOCOLATE SHOP.</div>
    </footer>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5mil7Axii3dSqUOAnU_Xd--hIp9ErKbfuw41vuPlOvPpt9tdZT2I6ZjmiU0No192j/exec";
    const btn = document.getElementById("btnRedeem");
    const input = document.getElementById("codeInput");
    const results = document.getElementById("results");

    window.onbeforeunload = function() {
      if (results.children.length > 0) return "ความหวานจะหายไปหากคุณรีเฟรชหน้าจอ!";
    };

    btn.addEventListener("click", async () => {
      const code = input.value.trim();
      if (!code) return;

      btn.disabled = true;
      btn.innerHTML = "กำลังดึงความหวาน... ⏳";
      results.innerHTML = "";

      try {
        const res = await fetch(`${API_URL}?action=redeem&text=${encodeURIComponent(code)}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "result-item-sweet";
            div.innerHTML = `
              <span class="tag-sweet">${item.appName || 'Special Dessert'}</span>
              <div class="reply-text-sweet">${item.reply}</div>
              <button class="btn-copy-sweet">คัดลอกรหัสความหวาน</button>
            `;
            div.querySelector("button").onclick = (e) => copyText(item.reply, e.target);
            results.appendChild(div);
          });
          window.scrollTo({ top: results.offsetTop - 20, behavior: 'smooth' });
        } else {
          results.innerHTML = `<div style="text-align:center; padding:20px; font-size:0.8rem; color:#e57373; font-weight:700;">ไม่พบความหวานที่คุณค้นหาค่ะ 🥺</div>`;
        }
      } catch (e) {
        results.innerHTML = `<div style="text-align:center; padding:20px; font-size:0.8rem; color:#e57373;">เกิดข้อผิดพลาดในการเชื่อมต่อ</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>รับความหวาน</span><span>🍪</span>";
      }
    });

    function copyText(text, el) {
      navigator.clipboard.writeText(text).then(() => {
        const oldText = el.innerHTML;
        el.innerHTML = "คัดลอกสำเร็จ ✨";
        el.style.color = "#90beaa";
        el.style.borderColor = "#90beaa";
        setTimeout(() => {
          el.innerHTML = oldText;
          el.style = "";
        }, 2000);
      });
    }
  </script>
</body>
</html>
