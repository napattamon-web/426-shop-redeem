<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>426 SHOP – Redeem Code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #f8f5f2;
      --main-brown: #8d7765;
      --deep-brown: #5d4a3e;
      --soft-cream: #ffffff;
      --accent-green: #9fb8ad;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-color);
      font-family: 'Anuphan', sans-serif;
      color: var(--deep-brown);
      display: flex; justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .app-wrapper {
      width: 100%;
      max-width: 420px;
      margin: 40px 20px 60px;
      display: flex; flex-direction: column;
    }
    .header { text-align: center; margin-bottom: 35px; }
    .logo-box {
      width: 90px; height: 90px;
      margin: 0 auto 20px;
      background: var(--soft-cream);
      border-radius: 32px;
      padding: 6px;
      box-shadow: 0 10px 25px rgba(141, 119, 101, 0.1);
      transition: transform 0.5s ease;
    }
    .logo-box:hover { transform: rotate(5deg) scale(1.05); }
    .logo-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 26px; }
    .header h1 { font-size: 1.5rem; margin: 0; font-weight: 700; letter-spacing: 1.5px; }
    .header p {
      font-size: 0.8rem; margin-top: 6px; color: var(--main-brown);
      font-weight: 500; text-transform: uppercase; letter-spacing: 4px; opacity: .8;
    }

    .card-main {
      background: var(--soft-cream);
      border-radius: 40px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(141, 119, 101, 0.1);
    }

    .label-hint {
      font-size: 0.85rem; font-weight: 600; color: var(--main-brown);
      margin-bottom: 15px; display: block; text-align: center;
    }

    .input-field {
      background: #fafaf9;
      border-radius: 20px;
      padding: 18px;
      border: 1.5px solid #eee;
      transition: all .3s ease;
    }
    .input-field:focus-within {
      border-color: var(--main-brown);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(141, 119, 101, 0.05);
    }
    textarea {
      width: 100%; height: 90px; border: none;
      font-family: 'Anuphan', sans-serif; font-size: 1.1rem;
      color: var(--deep-brown); resize: none; background: transparent;
      line-height: 1.5;
    }

    .btn-submit {
      width: 100%; padding: 18px; border-radius: 22px;
      background: var(--deep-brown); color: #fff;
      font-size: 1.1rem; font-weight: 600; border: none;
      cursor: pointer; margin-top: 20px;
      transition: all .3s ease;
    }
    .btn-submit:hover {
      background: var(--main-brown);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(93, 74, 62, 0.2);
    }
    .btn-submit:active { transform: translateY(0); }

    #status {
      text-align: center; font-size: .85rem; margin-top: 15px;
      font-weight: 600; min-height: 20px; color: var(--main-brown);
    }

    .result-item {
      margin-top: 25px;
      background: var(--soft-cream);
      border-radius: 40px 40px 40px 15px;
      padding: 30px;
      border-left: 6px solid var(--main-brown);
      animation: fadeIn .5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item-header {
      font-size: .75rem; font-weight: 700; color: #bca08e;
      margin-bottom: 15px; letter-spacing: 1px;
    }
    .item-body {
      font-size: 1.05rem; line-height: 2;
      color: var(--deep-brown); margin-bottom: 25px;
      white-space: pre-wrap; font-weight: 500;
    }

    .btn-copy {
      width: 100%; padding: 14px; border-radius: 16px;
      background: #fdfaf8; color: var(--main-brown);
      border: 1.5px solid #eee; font-weight: 700;
      cursor: pointer; font-size: .9rem; transition: all .2s ease;
    }
    .btn-copy:hover { border-color: var(--main-brown); background: #fff; }

    .footer {
      margin-top: 40px; text-align: center; padding-bottom: 40px;
    }
    .line-contact {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fff; border: 1px solid #eee;
      padding: 10px 22px; border-radius: 50px;
      font-weight: 700; font-size: .85rem; color: #06c755;
    }
    .copyright {
      margin-top: 20px; font-size: .75rem; font-weight: 600;
      letter-spacing: 6px; color: #bca08e; text-transform: uppercase;
    }

    .shake { animation: shake .4s; border-color: #e57373 !important; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <header class="header">
      <div class="logo-box">
        <img src="https://img2.imgbiz.com/imgbiz/IMG_0923.jpeg" alt="426 SHOP" />
      </div>
      <h1>426 SHOP</h1>
      <p>Premium Access</p>
    </header>

    <main class="card-main">
      <span class="label-hint">กรอกรหัสรับสินค้าเพื่อเริ่มใช้งาน</span>
      <div class="input-field">
        <textarea id="codeInput" placeholder="วางรหัสของคุณที่นี่..."></textarea>
      </div>

      <div id="status"></div>

      <button class="btn-submit" id="btnRedeem">รับสินค้า</button>

      <div id="results"></div>
    </main>

    <footer class="footer">
      <div class="line-contact">
        <span style="color:#999;font-weight:500;">Support:</span> @467dlpti
      </div>
      <div class="copyright">426 SHOP . EST 2024</div>
    </footer>
  </div>

  <script>
    // 🔗 ใส่ URL Web App ของ Apps Script ที่ deploy แล้ว
    const API_URL = "https://script.google.com/macros/s/AKfycby5mil7Axii3dSqUOAnU_Xd--hIp9ErKbfuw41vuPlOvPpt9tdZT2I6ZjmiU0No192j/exec";

    const btnRedeem = document.getElementById("btnRedeem");
    btnRedeem.addEventListener("click", redeem);

    function redeem() {
      const status = document.getElementById("status");
      const inputContainer = document.querySelector(".input-field");
      const input = document.getElementById("codeInput").value.trim();

      if (!input) {
        inputContainer.classList.add("shake");
        status.innerHTML = "กรุณาระบุรหัสสินค้าค่ะ";
        status.style.color = "#e57373";
        setTimeout(() => inputContainer.classList.remove("shake"), 500);
        return;
      }

      btnRedeem.disabled = true;
      btnRedeem.innerHTML = "กำลังดำเนินการ...";
      status.style.color = "var(--main-brown)";
      status.innerHTML = "ตรวจสอบข้อมูลในระบบน้า...";

      const url = API_URL + "?action=redeem&text=" + encodeURIComponent(input);

      fetch(url)
        .then((res) => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then((data) => {
          btnRedeem.disabled = false;
          btnRedeem.innerHTML = "รับสินค้า";
          renderResult(data);
        })
        .catch((err) => {
          console.error(err);
          btnRedeem.disabled = false;
          btnRedeem.innerHTML = "รับสินค้า";
          status.innerHTML = "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้งค่ะ";
          status.style.color = "#e57373";
        });
    }

    function renderResult(res) {
      const resDiv = document.getElementById("results");
      const status = document.getElementById("status");
      resDiv.innerHTML = "";

      if (!res) {
        status.innerHTML = "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้งค่ะ";
        status.style.color = "#e57373";
        return;
      }

      let msgLines = [];
      if (res.message) msgLines.push(res.message);
      if (res.overflowMessage) msgLines.push(res.overflowMessage);
      if (res.multiInLineMessage) msgLines.push(res.multiInLineMessage);

      if (res.notFound && res.notFound.length) {
        msgLines.push("โค้ดที่ไม่พบในระบบ:");
        res.notFound.forEach((c) => msgLines.push("• " + c));
      }

      if (res.used && res.used.length) {
        msgLines.push("โค้ดที่ถูกใช้งานไปแล้ว:");
        res.used.forEach((u) => {
          let line = "• " + u.code;
          if (u.app) line += " (" + u.app + ")";
          if (u.usedAt) line += " — " + u.usedAt;
          msgLines.push(line);
        });
      }

      status.innerHTML = msgLines.join("<br>");
      status.style.color = res.ok ? "var(--main-brown)" : "#e57373";

      if (res.items && res.items.length > 0) {
        res.items.forEach((item) => {
          const card = document.createElement("div");
          card.className = "result-item";
          const safeReplyText = encodeURIComponent(item.reply);

          card.innerHTML = `
            <div class="item-header">REDEEMED CODE: ${item.code}</div>
            <div class="item-body">${item.reply}</div>
            <button class="btn-copy" data-text="${safeReplyText}">คัดลอกรายละเอียด</button>
          `;
          resDiv.appendChild(card);
        });

        document.querySelectorAll(".btn-copy").forEach((btn) => {
          btn.addEventListener("click", () => copyToClipboard(btn));
        });

        window.scrollTo({ top: resDiv.offsetTop - 20, behavior: "smooth" });
      }
    }

    function copyToClipboard(btn) {
      const text = decodeURIComponent(btn.getAttribute("data-text") || "");
      if (!navigator.clipboard) {
        const temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
      } else {
        navigator.clipboard.writeText(text);
      }

      const originalText = btn.innerHTML;
      btn.innerHTML = "คัดลอกสำเร็จแล้ว ✨";
      btn.style.background = "#f0f4f2";
      btn.style.color = "var(--accent-green)";
      btn.style.borderColor = "var(--accent-green)";
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.style.background = "#fdfaf8";
        btn.style.color = "var(--main-brown)";
        btn.style.borderColor = "#eee";
      }, 2000);
    }
  </script>
</body>
</html>
