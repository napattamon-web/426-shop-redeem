<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>426 SHOP – Cute Handwritten Style</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --milk-tea: #bca08e;
      --choco: #6d4c41;
      --cream: #fdfaf7;
      --strawberry: #ffb7b7;
      --white: #ffffff;
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
      font-family: 'Anuphan', sans-serif; /* ฟอนต์สไตล์วัยรุ่น สะอาดตา */
    }

    body {
      margin: 0; padding: 0;
      background-color: #fcf8f5;
      color: var(--choco);
      display: flex; justify-content: center; min-height: 100vh;
      background-image: radial-gradient(var(--milk-tea) 0.5px, transparent 0.5px);
      background-size: 20px 20px; /* พื้นหลังลายจุดมินิมอล */
    }

    .app-container {
      width: 100%; max-width: 400px;
      padding: 30px 20px;
      display: flex; flex-direction: column; gap: 15px;
    }

    /* Header ลายมือวัยรุ่น */
    .header { text-align: center; margin-bottom: 5px; }
    .brand-name {
      font-size: 2.5rem; font-weight: 700; color: var(--choco);
      letter-spacing: -1px; margin: 0;
      transform: rotate(-2deg); /* เอียงเล็กน้อยให้ดูเหมือนลายมือ */
    }
    .status-badge {
      display: inline-block; background: var(--white);
      padding: 5px 15px; border-radius: 99px;
      font-size: 0.75rem; font-weight: 700; color: #90beaa;
      border: 1.5px solid #90beaa; margin-top: 10px;
    }

    /* แจ้งเตือนกระพริบดึงดูดสายตา */
    .sticky-note {
      background: var(--strawberry); color: var(--white);
      padding: 12px; border-radius: 20px;
      text-align: center; font-weight: 700; font-size: 0.85rem;
      box-shadow: 0 5px 15px rgba(255, 183, 183, 0.4);
      animation: pulse-warn 1.5s infinite;
    }
    @keyframes pulse-warn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); background: #ff9999; }
    }

    /* กล่องหลักทรงหมีโค้งมน */
    .main-card {
      background: var(--white); border-radius: 40px;
      padding: 30px 20px; border: 3px solid var(--milk-tea);
      box-shadow: 0 10px 0 var(--milk-tea);
      position: relative; transition: 0.3s;
    }

    /* ช่องกรอกข้อมูล */
    .input-box {
      background: var(--cream); border-radius: 25px;
      padding: 15px; border: 2.5px solid transparent;
      margin-top: 10px; transition: 0.3s;
    }
    .input-box.error {
      border-color: var(--strawberry);
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    textarea {
      width: 100%; height: 80px; border: none; background: transparent;
      font-size: 1.1rem; color: var(--choco); text-align: center;
      outline: none; font-weight: 600;
    }
    textarea::placeholder { color: #d4c4b5; }

    /* ปุ่มกดนุบนิบ */
    .btn-redeem {
      width: 100%; padding: 18px; margin-top: 20px; border-radius: 25px;
      border: none; background: var(--choco); color: var(--cream);
      font-size: 1.2rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 6px 0 #4e342e; transition: 0.1s;
    }
    .btn-redeem:active {
      transform: translateY(4px); box-shadow: 0 2px 0 #4e342e;
    }

    /* ระบบแจ้งเตือนผลลัพธ์ */
    .result-bubble {
      background: var(--white); border-radius: 30px;
      padding: 20px; margin-top: 15px; border: 2px solid var(--milk-tea);
      animation: pop-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop-up { from { transform: scale(0.5); opacity: 0; } }

    .copy-btn {
      width: 100%; padding: 12px; margin-top: 12px; border-radius: 20px;
      border: 2px solid var(--milk-tea); background: var(--white);
      color: var(--milk-tea); font-weight: 700; cursor: pointer;
    }

    footer { text-align: center; padding: 20px; font-weight: 700; font-size: 0.8rem; color: var(--milk-tea); }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1 class="brand-name">426 SHOP</h1>
      <div class="status-badge">ONLINE 24 HOURS</div>
    </header>

    <div class="sticky-note">
      ห้ามรีเฟรชหน้าจอนะคะ ข้อมูลจะหายไปเลย!
    </div>

    <main class="main-card" id="mainCard">
      <div style="text-align: center; font-weight: 700; margin-bottom: 10px;">กรอกโค้ดรับสินค้าตรงนี้เลย</div>
      
      <div class="input-box" id="inputFrame">
        <textarea id="codeInput" placeholder="วางโค้ดที่แอดมินส่งให้..."></textarea>
      </div>

      <button class="btn-redeem" id="btnGo">รับสินค้าแจ้งโค้ด</button>
      
      <div style="display: flex; justify-content: space-between; margin-top: 15px; padding: 0 10px;">
        <span onclick="document.getElementById('codeInput').value=''" style="font-size: 0.75rem; font-weight: 700; color: #ccc; cursor: pointer;">ล้างโค้ด</span>
        <span onclick="location.href='https://line.me/ti/p/@467dlpti'" style="font-size: 0.75rem; font-weight: 700; color: var(--milk-tea); cursor: pointer;">ติดต่อแอดมิน</span>
      </div>
    </main>

    <div id="resultArea"></div>

    <footer>
      LINE OFFICIAL: @467dlpti
    </footer>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5mil7Axii3dSqUOAnU_Xd--hIp9ErKbfuw41vuPlOvPpt9tdZT2I6ZjmiU0No192j/exec";
    const btn = document.getElementById("btnGo");
    const input = document.getElementById("codeInput");
    const frame = document.getElementById("inputFrame");
    const results = document.getElementById("resultArea");

    // ระบบแจ้งเตือนกันรีเฟรช
    window.onbeforeunload = function() {
      if (results.children.length > 0) return "รหัสจะหายไปหากคุณออกตอนนี้!";
    };

    btn.addEventListener("click", async () => {
      const val = input.value.trim();
      
      // 1. ระบบแจ้งเตือนหากไม่แจ้งโค้ด (Validation)
      if (!val) {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // สั่น
        frame.classList.add("error");
        btn.innerHTML = "ลืมใส่รหัสหรือเปล่าคะ?";
        btn.style.background = "#ffb7b7";
        
        setTimeout(() => {
          frame.classList.remove("error");
          btn.innerHTML = "รับสินค้าแจ้งโค้ด";
          btn.style.background = "";
        }, 2000);
        return;
      }

      // 2. เริ่มโหลด
      btn.disabled = true;
      btn.innerHTML = "รอแป๊บนึงน้า กำลังดึงรหัส...";
      results.innerHTML = "";

      try {
        const res = await fetch(`${API_URL}?action=redeem&text=${encodeURIComponent(val)}`);
        const data = await res.json();
        
        if (data.ok && data.items.length > 0) {
          data.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "result-bubble";
            div.innerHTML = `
              <div style="font-size:0.7rem; font-weight:700; color:#bca08e; margin-bottom:5px;">เย้! ได้รับสินค้าแล้ว</div>
              <div style="font-weight:600; line-height:1.5;">${item.reply}</div>
              <button class="copy-btn" onclick="copyOk('${item.reply.replace(/\n/g, "\\n")}', this)">คัดลอกรายละเอียด</button>
            `;
            results.appendChild(div);
          });
          // เลื่อนหน้าจอลงมาให้เห็นรหัส
          window.scrollTo({ top: results.offsetTop - 50, behavior: 'smooth' });
        } else {
          showError("ไม่พบรหัสสินค้าในระบบค่ะ");
        }
      } catch (e) {
        showError("ระบบขัดข้อง โปรดลองใหม่อีกครั้งค่ะ");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "รับสินค้าแจ้งโค้ด";
      }
    });

    function showError(msg) {
      results.innerHTML = `<div style="text-align:center; padding:20px; font-weight:700; color:#ffb7b7;">${msg}</div>`;
      if (navigator.vibrate) navigator.vibrate(200);
    }

    function copyOk(text, el) {
      navigator.clipboard.writeText(text.replace(/\\n/g, "\n")).then(() => {
        const oldText = el.innerHTML;
        el.innerHTML = "คัดลอกสำเร็จแล้วค่า! ✨";
        el.style.background = "#fdfaf7";
        el.style.borderColor = "#90beaa";
        el.style.color = "#90beaa";
        setTimeout(() => {
          el.innerHTML = oldText;
          el.style = "";
        }, 2000);
      });
    }
  </script>
</body>
</html>
